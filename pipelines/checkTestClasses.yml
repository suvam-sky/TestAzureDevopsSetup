# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml


trigger : none


jobs:
- deployment: ValidateAndDeployment
  displayName: Validate and deployment
  pool:
    vmImage: ubuntu-latest
  environment: 
   name: $(environmentName)
  strategy:
    runOnce:
      deploy:
        steps:
        - checkout: self
          clean: true
          fetchDepth: full
          persistCredentials: true
        - task: NodeTool@0 
          inputs:
            versionSpec: '20.x'
        - task: DownloadSecureFile@1
          name: SalesforceToken
          displayName: 'Download auth file for SFDX'
          inputs:
            secureFile: $(environmentName)Token.json

          env:
              BRANCH_NAME: $(Build.SourceBranchName)
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        - script: |
            if ! command -v sfdx &> /dev/null
              then
                  echo "SFDX Not found, installing..."
                  npm install -g @salesforce/cli --loglevel verbose
                #   echo y | sf plugins install sfdx-git-delta
                  # echo y | sfdx plugins:install @salesforce/sfdx-scanner
                #   sf plugins install @salesforce/sfdx-scanner
              else
                  echo "SFDX installed."
            fi
          displayName: "Install SFDX and SDG"
        
        - script: |
            sf org login sfdx-url -f $(SalesforceToken.secureFilePath) -a $(environmentName)
          displayName: "Salesforce Login"
       
        - task: UsePythonVersion@0
          inputs:
            versionSpec: '3.x'
            addToPath: true

        # - script: |
        #     python3 -c "
        #     import os

        #     # Define the directory containing the classes
        #     classes_dir = 'force-app/main/default/classes'

        #     # List all files in the directory
        #     files = os.listdir(classes_dir)

        #     # Filter out files containing 'Test' in their name and with the .cls extension,
        #     # and remove the .cls extension
        #     test_classes = [f.replace('.cls', '') for f in files if 'Test' in f and f.endswith('.cls')]

        #     # Display the class names in the console output
        #     print('Test Classes Found:')
        #     for test_class in test_classes:
        #         print(test_class)

        #     # Write the filtered class names to a text file
        #     with open('test_classes.txt', 'w') as f:
        #         for test_class in test_classes:
        #             f.write(test_class + '\\n')
        #     "
        #   displayName: 'Find Test Classes and Write to File'
        #   workingDirectory: '$(Build.SourcesDirectory)'

        - task: Bash@3
          displayName: 'Run Apex Tests from File and Validate Pass Rate'
          inputs:
            targetType: 'inline'
            script: |
              # file="test_classes.txt" # if the txt file is in the folder

              echo "=========Scanning for Apex test classes...============="
              
              find force-app/main/default/classes -type f -name "*.cls" -print | grep -i 'Test' | while read -r file; do
                # Extract class name (filename without path and extension)
                basename "$file" .cls
              done > test_classes.txt

              echo "==========Generated test_classes.txt with the following classes:=============="
              cat test_classes.txt
              file="test_classes.txt"
              failed=0

              while IFS= read -r line || [ -n "$line" ]; do
                class=$(echo "$line" | sed 's/[,[:space:]]*$//')
                  if [ -n "$class" ]; then
                    echo "Test Class: $class"
                    output=$(sf apex run test --class-names "$class"  --result-format human  --synchronous --target-org $(environmentName))
                    echo "=================== TEST CLASS RESULTS ==========================="
                    echo "$output"
                    echo "=================================================================="
                    
                    pass_rate=$(echo "$output" | grep "Pass Rate" | awk '{print $NF}' | sed 's/%//')
                    echo "Pass Rate for $class: $pass_rate%"
                    
                    if (( $(echo "$pass_rate < 90" | bc -l) )); then
                      echo "❌ Test class $testClass has pass rate below 90%"
                      failed=1
                    else
                      echo "✅ Test class $testClass passed threshold"
                    fi
                  fi
                
              done < "$file"
              
              if [ "$failed" -eq 1 ]; then
                echo "One or more test classes failed to meet the pass rate threshold"
                exit 1
              fi
